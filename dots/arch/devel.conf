# Build dependencies for Noon-libqt.
pkgs {
  clang cmake ninja git

  mpvqt
  libdrm libqalculate libxcursor

  # LaTeX renderer is optional; built only when clatexmath is available.
  cairomm pangomm

  qt6-base qt6-declarative qt6-5compat

  # Runtime QML modules imported by the shell.
  qt6-imageformats qt6-multimedia qt6-wayland
}
