# Hyprland session and Noon shell runtime.
pkgs {
  hyprland hyprcursor hypridle
  hyprpicker hyprutils hyprwayland-scanner hyprland-protocols
  hyprland-qt-support
  xdg-desktop-portal xdg-desktop-portal-gtk xdg-desktop-portal-hyprland

  sddm networkmanager bluez polkit gnome-keyring
  pipewire wireplumber upower gammastep geoclue

  # KDE/Qt integration (no Plasma desktop required).
  plasma-integration kdialog knewstuff kconfig kwallet
  polkit-kde-agent bluedevil plasma-nm
  darkly-bin
  dolphin ark partitionmanager systemsettings nm-connection-editor
  kdeconnect network-manager-applet
  pavucontrol-qt playerctl

  # Runtime libraries used by Noon's QML modules.
  libdrm libglvnd jemalloc mpv libqalculate satty

  quickshell-git
  xdg-user-dirs xdg-utils
}

# Shell utilities.
pkgs {
  brightnessctl ddcutil ydotool auto-cpufreq
  wl-clipboard cliphist grim slurp grimblast-git libnotify
  jq curl ripgrep rsync uv ffmpeg yt-dlp translate-shell
  zenity
  matugen-bin qt6ct
  python-pillow python-numpy python-tqdm python-ytdlp python-loguru python-click python-numpy
  fontconfig hicolor-icon-theme gtk3 gtk4 libadwaita adw-gtk-theme
  dconf gsettings-desktop-schemas
}

python {
  click
  loguru
  psutil
}
