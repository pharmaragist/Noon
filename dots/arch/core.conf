# Noon shell runtime (compositor chosen on the Compositor page).
pkgs {
  xdg-desktop-portal xdg-desktop-portal-gtk

  networkmanager bluez polkit gnome-keyring
  pipewire wireplumber upower geoclue

  # KDE/Qt integration (no Plasma desktop required).
  plasma-integration kdialog knewstuff kconfig kwallet
  polkit-kde-agent bluedevil plasma-nm
  darkly-bin
  dolphin ark partitionmanager systemsettings nm-connection-editor
  kdeconnect network-manager-applet
  pavucontrol-qt playerctl

  # Runtime libraries used by Noon's QML modules.
  libdrm libglvnd jemalloc mpv-mpris libqalculate satty
  gowall
  quickshell
  xdg-user-dirs xdg-utils
}

# Shell utilities.
pkgs {
  brightnessctl ddcutil ydotool auto-cpufreq
  wl-clipboard cliphist grim slurp grimblast-git libnotify
  jq curl ripgrep rsync uv ffmpeg yt-dlp translate-shell
  zenity
  matugen-bin qt6ct gammastep
  fontconfig gtk3 gtk4 adw-gtk-theme
  dconf gsettings-desktop-schemas
  libpulse psmisc
}
