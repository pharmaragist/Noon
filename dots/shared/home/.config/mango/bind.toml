[bind.default.lock]

"SUPER+l" = "spawn,$ipc global lock"
"SUPER+SHIFT+l" = "spawn_shell,sleep 0.1 && systemctl suspend || loginctl suspend"
"SUPER+SHIFT+r" = "spawn,$ipc global pick_random_wall"
"SUPER+SHIFT+s" = "spawn,$ipc global toggle_screenshot"
"CTRL+SHIFT+ALT+SUPER+Delete" = "spawn_shell,systemctl poweroff || loginctl poweroff"

"Print" = "spawn_shell,grim - | wl-copy"
"CTRL+Print" = "spawn_shell,mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_\"$(date '+%Y-%m-%d_%H.%M.%S')\".png"

"XF86AudioPlay" = "spawn,$ipc global toggle_playing"
"XF86AudioPrev" = "spawn_shell,$ipc global previous_track || playerctl previous"
"XF86AudioNext" = "spawn_shell,$ipc global next_track || playerctl next"
"XF86AudioRaiseVolume" = "spawn,$ipc global volume_up"
"XF86AudioLowerVolume" = "spawn,$ipc global volume_down"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_SINK@ toggle"

"XF86MonBrightnessUp" = "spawn_shell,$ipc global inc_brightness || brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn_shell,$ipc global dec_brightness || brightnessctl set 5%-"

[bind.default.release]
"SUPER+Super_L" = "spawn,$ipc noon toggle_beam"
