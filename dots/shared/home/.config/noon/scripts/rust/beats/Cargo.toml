[package]
name = "beats"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
libc = "0.2.191"
libmpv = { package = "libmpv-sirno", version = "2.0.2-fork.1" }
libmpv-sys-sirno = "2.0.0-fork.1"
lofty = "0.25.5"
md5 = "0.8.1"
rand = "0.10.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.9"
walkdir = "2.5.0"
zbus = "6.5.0"

[profile.release]
lto = true
strip = true
