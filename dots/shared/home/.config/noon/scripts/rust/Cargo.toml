[package]
name = "noon-scripts"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = ["harness", "beats"]

[[bin]]
name = "npc"
path = "npc.rs"

[[bin]]
name = "weather"
path = "weather.rs"

[[bin]]
name = "position_clock"
path = "position_clock.rs"

[[bin]]
name = "thumbnails"
path = "thumbnails.rs"

[[bin]]
name = "colors"
path = "colors.rs"

[[bin]]
name = "thawb"
path = "thawb.rs"

[[bin]]
name = "icons"
path = "icons.rs"

[[bin]]
name = "packages"
path = "packages.rs"

[[bin]]
name = "store"
path = "store.rs"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
fd-lock = "4.0.4"
ffmpeg-the-third = { version = "=5.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
flate2 = "1.1.11"
image = "0.25.10"
md5 = "0.8.1"
palette = "0.7.7"
png = "0.18.1"
rayon = "1.12.0"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.9"
wait-timeout = "0.2.1"
walkdir = "2.5.0"
xz2 = "0.1.7"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
