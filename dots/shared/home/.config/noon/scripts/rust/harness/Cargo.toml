[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
anyhow = "1.0.104"
smol = "2.0.2"
futures = "0.3.34"
rusqlite = "0.43.0"
regex = "1.13.2"
walkdir = "2.5.0"
base64 = "0.23.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
