# Hyprland session and Noon shell runtime.
copr {
  ashbuk/Hyprland-Fedora
  achno/gowall
  deltacopy/darkly
}

pkgs {
  hyprland hyprcursor hypridle
  hyprpicker hyprutils hyprwayland-scanner
  hyprland-protocols-devel hyprland-guiutils hyprtoolkit
  xdg-desktop-portal xdg-desktop-portal-hyprland xdg-desktop-portal-gtk

  sddm NetworkManager bluez polkit gnome-keyring
  pipewire wireplumber upower gammastep geoclue2

  # KDE/Qt integration (no Plasma desktop required).
  plasma-integration kdialog kf6-knewstuff kf6-kconfig kf6-kwallet
  polkit-kde bluedevil plasma-nm darkly-qt5 darkly-qt6
  dolphin ark kde-partitionmanager plasma-systemsettings nm-connection-editor
  kde-connect network-manager-applet
  pavucontrol-qt playerctl

  # Runtime libraries used by Noon's QML modules.
  libdrm libglvnd jemalloc mpv-libs libqalculate

  quickshell
  xdg-user-dirs xdg-utils
}

# Shell utilities.
pkgs {
  brightnessctl ddcutil ydotool auto-cpufreq
  wl-clipboard cliphist grim slurp grimblast libnotify satty
  jq curl ripgrep rsync uv ffmpeg yt-dlp translate-shell
  zenity
  matugen gowall qt6ct
  python3-pillow python3-numpy python3-tqdm python3-feedparser
  fontconfig hicolor-icon-theme gtk3 gtk4 libadwaita adw-gtk3-theme
  dconf gsettings-desktop-schemas
}

python {
  click
  loguru
  psutil
}
