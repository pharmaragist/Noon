# Build dependencies for Noon-libqt.
pkgs {
  git
  gcc gcc-c++
  cmake
  ninja-build

  mpvqt-devel
  libdrm-devel
  libqalculate-devel
  libXcursor-devel

  # LaTeX renderer is optional; built only when clatexmath is available.
  cairomm-devel pangomm-devel

  qt6-qtbase-devel
  qt6-qtdeclarative-devel

  # Runtime QML modules imported by the shell.
  qt6-qtbase qt6-qtdeclarative qt6-qt5compat
  qt6-qtimageformats qt6-qtmultimedia qt6-qtwayland
}
